tools:
- name: verify_dob
  purpose: Verify borrower date of birth (DOB) against case-linked customer challenge record.
  input: case_id(optional), customer_id(optional), dob(required, YYYY-MM-DD)
  output: status(verified|failed|locked), field=dob, failed_attempts

- name: verify_mobile
  purpose: Verify borrower mobile number against case-linked customer challenge record.
  input: case_id(optional), customer_id(optional), phone(required, local/international accepted)
  output: status(verified|failed|locked), field=phone, failed_attempts

- name: loan_policy_lookup
  purpose: Retrieve policy limits that govern promises, waivers, and restructuring decisions.
  input: case_id(optional), loan_id(optional)
  output: policy constraints

- name: offer_eligibility
  purpose: Determine baseline concession eligibility under deterministic policy rules.
  input: case_id, hardship_flag(optional), requested_waiver_pct(optional)
  output: allowed, offer_type, approved_waiver_pct

- name: plan_propose
  purpose: Create or revise EMI plan options for hardship negotiation.
  input: case_id, hardship_reason(optional), revision_index(optional), max_installment_amount(optional)
  output: plan_id, monthly_amount, first_due_date, status

- name: payment_link_create
  purpose: Generate payment link for immediate borrower payment intent.
  input: case_id, amount, channel(optional)
  output: payment_reference_id, payment_url, expires_at

- name: promise_capture
  purpose: Save borrower promise-to-pay commitment details.
  input: case_id, promised_date, promised_amount
  output: promise_id, status

- name: premium_hold_create
  purpose: Create and persist an approved premium hold with a newly generated reference.
  input: case_id, customer_id, program_id, hold_months
  output: reference_number, effective_from, effective_until, status

- name: sms_confirmation_send
  purpose: Send and persist the premium-hold confirmation to the registered mobile number.
  input: customer_id, reference_number, message
  output: message_id, recipient, status

- name: email_confirmation_send
  purpose: Send and persist the premium-hold confirmation to the registered email address.
  input: customer_id, reference_number, subject, message
  output: message_id, recipient, status

- name: outbound_callback_schedule
  purpose: Schedule a durable outbound voice callback after a wrong-party or customer callback request.
  input: case_id, customer_id, session_id, callback_time, timezone(optional), phone(optional), max_retries(optional)
  output: job_id, scheduled_for(absolute timestamp), status, retry_count

- name: outbound_callback_cancel
  purpose: Cancel queued outbound callbacks by job ID or case ID.
  input: job_id(optional), case_id(optional), reason(optional)
  output: cancelled_job_ids, status

- name: human_escalation
  purpose: Escalate disputes/fraud/sensitive cases to human collections desk.
  input: case_id, reason
  output: escalation_id, queue, priority
